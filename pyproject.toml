[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crew-system"
version = "0.1.0"
description = "Background agent OS for strategic communication planning."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Crew_System" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[project.scripts]
crew-system = "crew_system.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crew_system = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
