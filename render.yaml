services:
  - type: web
    runtime: python
    name: crew-system-api
    plan: starter
    region: frankfurt
    buildCommand: python -m pip install --upgrade pip && python -m pip install -e .
    startCommand: python -m crew_system api serve --host 0.0.0.0 --port $PORT --provider auto
    healthCheckPath: /health
    disk:
      name: crew-system-workspace
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CREW_SYSTEM_WORKSPACE
        value: /var/data/workspace
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMINI_TEMPERATURE
        value: "0.3"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "240"
      - key: GEMINI_MAX_RETRIES
        value: "3"
      - key: GEMINI_RESPONSE_SCHEMA
        value: "false"
